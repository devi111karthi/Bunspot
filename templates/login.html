{% extends 'base.html' %}
{% block title %}- Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="text-center fw-bold mb-4" style="color:#f7931e">🍔 BunSpot Login</h3>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" required placeholder="Enter your email">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Enter your password">
          </div>
          <button type="submit" class="btn btn-orange w-100 fw-bold">Login</button>
        </form>

        <hr>
        <p class="text-center text-muted mb-0">
          New customer? <a href="{{ url_for('register') }}" class="text-warning fw-bold">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
